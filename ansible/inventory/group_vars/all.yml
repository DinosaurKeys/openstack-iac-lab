---
# Confirmed Ubuntu login account on all three reinstalled nodes.
ansible_user: joe
ansible_ssh_private_key_file: ~/.ssh/openstack-iac-lab
ansible_ssh_common_args: '-o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no'
ansible_python_interpreter: /usr/bin/python3
ansible_become: true
management_interface: enp0s31f6
provider_interface: ext0
management_gateway: 192.168.0.1
# Supply verified DNS addresses and each provider MAC before rendering Netplan.
management_dns: []
common_packages:
  - curl
  - git
  - jq
  - lvm2
  - smartmontools
  - chrony
  - python3
