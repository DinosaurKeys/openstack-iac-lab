---
- name: Require the documented operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('24.04', '>=')
      - ansible_facts.distribution_version is version('24.10', '<')
    fail_msg: This guide targets Ubuntu 24.04 LTS.
- name: Install the base tools
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    auto_install_module_deps: false
    update_cache: true
    cache_valid_time: 3600
- name: Set the intended hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
- name: Maintain the three management-name entries
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: '# {mark} OPENSTACK IAC LAB'
    block: |
      192.168.0.200 node1
      192.168.0.201 node2
      192.168.0.202 node3
- name: Read existing service units for the preview
  ansible.builtin.service_facts:
  when: ansible_check_mode
- name: Enable time synchronization
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started
  when: not ansible_check_mode or ansible_facts['services'].get('chrony.service', {}).get('status', 'not-found') != 'not-found'
- name: Explain the service check deferred until Chrony is installed
  ansible.builtin.debug:
    msg: 'DEFERRED: chrony.service is absent; its enable/start check requires the real package installation. No service was started by this preview.'
  when: ansible_check_mode and ansible_facts['services'].get('chrony.service', {}).get('status', 'not-found') == 'not-found'
