---
- name: Require the database password
  ansible.builtin.assert:
    that:
      - lab_db_password is defined
      - lab_db_password | length >= 20
  no_log: true
- name: Install Python virtual environment support
  ansible.builtin.apt:
    name: [python3-venv, python3-pip]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Create the service account
  ansible.builtin.user:
    name: labapp
    system: true
    shell: /usr/sbin/nologin
    create_home: false
- name: Create the application directory
  ansible.builtin.file:
    path: /opt/labapp
    state: directory
    owner: labapp
    group: labapp
    mode: '0755'
- name: Install the application source and requirements
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/opt/labapp/{{ item }}'
    owner: labapp
    group: labapp
    mode: '0644'
  loop: [app.py, requirements.txt]
  notify: Restart labapp
- name: Install application dependencies in a dedicated environment
  ansible.builtin.pip:
    requirements: /opt/labapp/requirements.txt
    virtualenv: /opt/labapp/venv
    virtualenv_command: python3 -m venv
  notify: Restart labapp
- name: Write the private service environment
  ansible.builtin.template:
    src: labapp.env.j2
    dest: /etc/labapp.env
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart labapp
- name: Install the service unit
  ansible.builtin.template:
    src: labapp.service.j2
    dest: /etc/systemd/system/labapp.service
    mode: '0644'
  notify: Restart labapp
- name: Start the application
  ansible.builtin.systemd_service:
    name: labapp
    daemon_reload: true
    enabled: true
    state: started
